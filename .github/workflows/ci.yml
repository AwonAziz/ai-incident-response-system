name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test with coverage
        run: pytest --cov=config --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train the model
        run: python scripts/train_model.py --samples 60 --evaluate

      - name: Run the pipeline headless
        run: python main.py --no-dashboard --no-notify --max-ticks 5 --inject-anomaly --inject-every 2 --summary-json

      - name: Simulate an incident through the control API
        run: |
          python main.py --no-dashboard --no-notify --max-ticks 20 --api --api-port 8080 &
          PID=$!
          for _ in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          python scripts/simulate_incident.py --cloud aws --count 2 --push http://127.0.0.1:8080/inject
          python -c "import json,urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8080/incidents'))['incidents'][:1])"
          kill $PID